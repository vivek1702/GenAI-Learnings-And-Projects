services:
  postgres:
    image: postgres:17
    container_name: notebooklm-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1517
      POSTGRES_DB: notebookLmLike
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebookLmLike"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
